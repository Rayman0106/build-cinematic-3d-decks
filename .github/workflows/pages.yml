name: Check showcase review sources (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site.py
      - run: python scripts/validate_package.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-case-lab.mjs
      - run: node scripts/test-case-adapters.mjs
      - run: node scripts/test-case-loading.mjs
      # The local real-project Lab depends on the separate generated asset bank.
      # Restore publication only after its hosting paths and distribution scope
      # have been reviewed. This workflow has no Pages/deployment permission.
